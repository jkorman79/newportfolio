<!DOCTYPE html>

    <title>Sword Project - Power BI Dashboard - Joseph Korman</title>
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .powerbi-container {
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: calc(100vh - 70px);
            margin: 0;
            padding: 0;
        }
        .powerbi-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .back-link {
            position: fixed;
            top: 80px;
            left: 20px;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 5px;
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .back-link:hover {
            background: rgba(255, 255, 255, 1);
            text-decoration: underline;
        }
        .back-link i {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">Joseph Korman</a>

                <a href="../video-production.html" class="nav-link">Video Production</a>
                <a href="../resume.html" class="nav-link">Resume</a>
                <a href="../contact.html" class="nav-link">Contact</a>
            </div>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

        <i class="fas fa-arrow-left"></i>Back to Business Analytics
    </a>
